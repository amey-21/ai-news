# .github/workflows/newsletter.yml

name: AI Digest Newsletter

# ---------------------------------------------------------------------------
# TRIGGERS
# When does this workflow run?
# ---------------------------------------------------------------------------
on:
  schedule:
    # Runs every 3 days at 8:00 AM UTC (1:30 PM IST)
    # Cron syntax: minute hour day-of-month month day-of-week
    # */3 means "every 3 days"
    - cron: "0 8 */3 * *"

  # workflow_dispatch allows manual triggering from GitHub UI
  # Essential for testing — you don't want to wait 3 days to verify it works
  workflow_dispatch:

# ---------------------------------------------------------------------------
# JOBS
# A workflow contains one or more jobs.
# Jobs run on GitHub's Ubuntu VMs — clean slate every time.
# ---------------------------------------------------------------------------
jobs:
  send-digest:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------------------------------------
      # Step 1: Check out your repository code onto the VM
      # Without this, the VM has no idea your project exists
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Step 2: Set up Python
      # The Ubuntu VM has Python installed but we specify the exact version
      # for reproducibility — same reason we pin package versions
      # -----------------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # -----------------------------------------------------------------------
      # Step 3: Cache pip dependencies
      # Why cache? Installing packages takes 30-60 seconds every run.
      # Caching stores installed packages between runs.
      # If requirements.txt hasn't changed → restore from cache → skip install
      # Saves time and GitHub Actions minutes.
      # -----------------------------------------------------------------------
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # -----------------------------------------------------------------------
      # Step 4: Install dependencies
      # Same requirements.txt as your local setup — environment parity
      # -----------------------------------------------------------------------
      - name: Install dependencies
        run: pip install -r requirements.txt

      # -----------------------------------------------------------------------
      # Step 5: Run the agent
      # GitHub injects secrets as environment variables before this step runs
      # os.getenv() in your Python code reads them exactly like .env locally
      # -----------------------------------------------------------------------
      - name: Run AI digest agent
        env:
          TAVILY_API_KEY:       ${{ secrets.TAVILY_API_KEY }}
          OPENAI_API_KEY:       ${{ secrets.OPENAI_API_KEY }}
          GMAIL_ADDRESS:        ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD:   ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL:      ${{ secrets.RECIPIENT_EMAIL }}
        run: python agent.py